name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint
      # next build generates next-env.d.ts (gitignored) and type-checks, so no separate tsc step.
      - run: npx next build
      - run: node scripts/check-built-html.mjs
